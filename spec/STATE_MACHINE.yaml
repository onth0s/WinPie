states:
  - IDLE
  - ACTIVE
  - WAIT_RELEASE

transitions:
  - from: IDLE
    event: WIN_ESC_DOWN
    to: ACTIVE
    effect: ACTIVATE

  - from: ACTIVE
    event: LBUTTON_DOWN
    to: IDLE_OR_WAIT_RELEASE
    effect: COMMIT_IF_VALID_ELSE_CANCEL

  - from: ACTIVE
    event: WIN_UP
    to: IDLE_OR_WAIT_RELEASE
    effect: COMMIT_IF_VALID_ELSE_CANCEL

  - from: ACTIVE
    event: RBUTTON_DOWN
    to: IDLE_OR_WAIT_RELEASE
    effect: CANCEL

  - from: ACTIVE
    event: FATAL_ERROR
    to: IDLE
    effect: CANCEL

  - from: WAIT_RELEASE
    event: ALL_KEYS_UP
    to: IDLE
    effect: REARM
